[project]
name = "project-1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"

# 기본 의존성 = Vercel 서버리스 함수(main.py)를 띄우는 데 필요한 최소 패키지.
# torch/chromadb 같은 무거운 RAG 의존성을 여기 넣으면 번들이 5GB를 넘어
# Vercel의 500MB 함수 크기 제한에 걸린다.
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
]

# RAG 에이전트(terms_reader_agent.py) 로컬 실행용 의존성.
#   설치: uv sync --extra rag
[project.optional-dependencies]
rag = [
    "chromadb>=1.5.9",
    "gradio>=6.20.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.4.9",
    "langchain-google-genai>=4.2.7",
    "langchain-huggingface>=1.2.2",
    "langchain-text-splitters>=1.1.2",
    "openai>=2.46.0",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "sentence-transformers>=5.6.0",
]
