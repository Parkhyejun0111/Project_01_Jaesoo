[project]
name = "project-1"
version = "0.1.0"
description = "약관 RAG 챗봇 (Claude + Voyage 임베딩)"
readme = "README.md"
requires-python = ">=3.12"

# 기본 의존성 = Vercel 서버리스 함수(main.py)를 띄우는 데 필요한 최소 패키지.
# 임베딩/LLM 모두 API 호출이라 torch·chromadb 같은 무거운 패키지가 필요 없다.
dependencies = [
    "anthropic>=0.69.0",
    "fastapi>=0.115.0",
    "numpy>=2.0.0",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.34.0",
    "voyageai>=0.3.0",
]

# 인덱스 사전 계산(build_index.py)에만 필요한 의존성. 서버에는 배포되지 않는다.
#   설치: uv sync --extra index
[project.optional-dependencies]
index = [
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.2",
    "pypdf>=6.14.2",
]
